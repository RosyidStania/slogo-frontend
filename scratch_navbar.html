<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #f5f5f7;
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 2rem;
    }
    .nav-container {
      position: relative;
      width: 400px;
      height: 70px;
      background-color: #1a1a1a;
      border-radius: 35px;
      display: flex;
    }
    .nav-item {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }
    .icon-circle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: transparent;
      transition: 0.5s;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }
    .nav-item.active .icon-circle {
      background-color: #f48c5a;
      transform: translateY(-32px);
    }
    
    .indicator {
      position: absolute;
      top: -35px;
      width: 70px;
      height: 70px;
      background-color: #f5f5f7;
      border-radius: 50%;
      transition: 0.5s;
      z-index: 5;
    }
    
    .indicator::before {
      content: '';
      position: absolute;
      top: 35px;
      left: -22px;
      width: 22px;
      height: 22px;
      background: transparent;
      border-top-right-radius: 22px;
      box-shadow: 1px -10px 0 0 #f5f5f7;
    }
    
    .indicator::after {
      content: '';
      position: absolute;
      top: 35px;
      right: -22px;
      width: 22px;
      height: 22px;
      background: transparent;
      border-top-left-radius: 22px;
      box-shadow: -1px -10px 0 0 #f5f5f7;
    }
  </style>
</head>
<body>

  <div class="nav-container">
    <div class="indicator" style="left: calc((100% / 4) * 1 + (100% / 4) / 2 - 35px);"></div>
    
    <div class="nav-item">
      <div class="icon-circle">H</div>
    </div>
    <div class="nav-item active">
      <div class="icon-circle">P</div>
    </div>
    <div class="nav-item">
      <div class="icon-circle">C</div>
    </div>
    <div class="nav-item">
      <div class="icon-circle">B</div>
    </div>
  </div>

</body>
</html>
